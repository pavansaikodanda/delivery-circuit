.links { display: inline-flex; gap: 4px; flex-wrap: wrap; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--dc-r-2); border: 1px solid transparent; font: inherit; font-size: var(--dc-t-sm); font-weight: 500; cursor: pointer; background: var(--vscode-button-background); color: var(--vscode-button-foreground); transition: background var(--dc-d-hover) var(--dc-ease), filter var(--dc-d-hover) var(--dc-ease), transform var(--dc-d-press) var(--dc-ease), border-color var(--dc-d-hover) var(--dc-ease), color var(--dc-d-hover) var(--dc-ease); position: relative; }

.seg button[aria-checked=true] { color: var(--dc-fg); font-weight: 600; }

.stagebar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.stagebar .segs { display: flex; gap: 2px; flex: 1; }
