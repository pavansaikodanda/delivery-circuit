# Filled in by a person at HC-1. Every bootstrap phase reads it. Contains no secrets.
github:
  org: acme-org           # GitHub organisation
  repo: salesDemoOrg               # new or existing Salesforce DX repo
  default_branch: main
people:                             # GitHub username + Atlassian email + Slack handle. Keep the three teams disjoint.
  architects: [{ gh: "", atlassian: "", slack: "" }]
  developers: [{ gh: "", atlassian: "", slack: "" }]
  testers:    [{ gh: "", atlassian: "", slack: "" }]
jira:
  site: https://<site>.atlassian.net
  project_key: ABC
  test_tool: none                   # none | xray | zephyr
confluence:
  space_key: SD                     # "Solution Designs"
salesforce:
  dev_sandbox_url: https://acme-demo.my.salesforce.com   # SDO trial org (DEV = QA)
  qa_sandbox_url:  https://acme-demo.my.salesforce.com
  prod_url:        none
  api_version: "66.0"               # from sfdx-project.json
slack:
  workspace: <name>
  channels: { arch: arch-gate, dev: dev-gate, qa: qa-gate }
transcripts:
  source: file                      # file | fireflies | both
ai:
  max_attempts: 3
  sf_ai_tester_in_ci: false         # true once the SF AI Tester CLI runs headless in CI (sets SF_AI_TESTER_IN_CI)
  sf_ai_tester_ref: "8a5b5c276901e1d6bf3a764015da0d3bf1cf0b78"   # github.com/pavansaikodanda/sf-ai-tester (SF_AI_TESTER_REF)
  sf_ai_tester_mode: manual         # manual | automation | both (SF_AI_TESTER_MODE)
