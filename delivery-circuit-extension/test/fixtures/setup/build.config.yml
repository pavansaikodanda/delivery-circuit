# Delivery Circuit v3 project settings. Filled in by a person at HC-1; every bootstrap phase reads it.
# It holds NO secrets and no tokens: every connection is a login (gh, sf, acli, claude, MCP OAuth).
# Placeholders below are samples (acme-org, ACME); replace them with the project's values.
github:
  org: acme-org                     # GitHub organisation that owns the repo
  repo: acme-salesforce             # new Salesforce DX repo created for this project
  default_branch: main
  visibility: private               # private is strongly recommended: the circuit uses self-hosted runners
people:                             # GitHub login + Atlassian email + Slack handle. Keep the three teams disjoint.
  architects: [{ gh: "", atlassian: "", slack: "" }]
  developers: [{ gh: "", atlassian: "", slack: "" }]
  testers:    [{ gh: "", atlassian: "", slack: "" }]
runners:                            # self-hosted GitHub Actions runners (B2). Logins live on these machines only.
  circuit:                          # PR checks with logins: QA deploy, Apex, SF AI Tester, AI Reviewer, Code Analyzer,
    name: circuit-1                 #   design-gate, persona-gates, fix-router
    labels: [circuit]
    os: linux                       # linux | macos | windows
  release:                          # deploy-prod only; holds the one login to the named production org
    name: circuit-release-1
    labels: [circuit-release]
    os: linux
jira:
  site: https://acme.atlassian.net
  project_key: ACME
  test_tool: none                   # none | xray | zephyr
  design_pending_statuses: "Backlog,Design Review"   # epic statuses that mean "design not approved" (design-gate)
confluence:
  space_key: SD                     # "Solution Designs": one design page per feature
  architects_group: architects      # only this group may edit design pages / set them to Approved
salesforce:                         # sf CLI aliases. Any connected org can be DEV or QA; only prod_alias is protected.
  dev_alias: dev
  qa_alias: qa
  prod_alias: prod                  # the org the project NAMES as production: AI never touches it
  api_version: "62.0"               # VERIFY current API version
slack:
  workspace: acme
  channels: { arch: arch-gate, dev: dev-gate, qa: qa-gate, review: review-room }
  transport: claude                 # claude (runner's claude CLI + Slack MCP) | github-app | off  (CIRCUIT_SLACK_TRANSPORT)
transcripts:
  sources: [paste, file, fireflies, wispr]   # stored at the source or encrypted on the Architect's machine; never in git
ai:
  max_attempts: 3                   # Fix with AI attempts before needs-human (MAX_AI_ATTEMPTS)
  sf_ai_tester_in_ci: false         # true once the SF AI Tester CLI runs headless on the circuit runner
  sf_ai_tester_ref: "8a5b5c276901e1d6bf3a764015da0d3bf1cf0b78"              # commit SHA of github.com/pavansaikodanda/sf-ai-tester for CI (SF_AI_TESTER_REF)
  sf_ai_tester_mode: manual         # manual | automation | both (SF_AI_TESTER_MODE)
