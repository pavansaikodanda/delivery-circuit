# Delivery Circuit v4 project settings. Filled in by a person during /circuit-bootstrap and committed with the repo.
# It holds NO secrets. The only stored credential of the circuit is one SFDX_AUTH_URL secret per GitHub Environment
# (qa, dev, sit, uat, production), set by an admin with `gh secret set SFDX_AUTH_URL --env <env>`. It lives in
# GitHub Environments, never in this file, never in git, never in a chat with Claude.
# Placeholders below are samples (acme-org, ACME, example.com); replace them with the project's values.
github:
  org: acme-org                     # GitHub organisation that owns the repo
  repo: acme-salesforce             # Salesforce DX repo for this project
people:                             # GitHub login + Atlassian email + Slack handle
  architects: [{ gh: "", atlassian: "", slack: "" }]
  developers: [{ gh: "", atlassian: "", slack: "" }]
  testers:    [{ gh: "", atlassian: "", slack: "" }]
  leads:      [{ gh: "", atlassian: "", slack: "" }]   # approve promotion PRs and production deploys
jira:
  site: https://acme.atlassian.net
  project_key: ACME
  ready_status: "Ready for Dev"     # set by people at refinement; /dev-start-story requires it
  test_issue_type: Test             # Test (Xray/Zephyr) or the sub-task type used for test cases
confluence:
  space_key: SD                     # one design page per feature
salesforce:                         # sf CLI aliases on the laptops (people's own logins)
  dev_alias: dev                    # each Developer's own DEV org: AI validates and deploys only here
  qa_alias: qa                      # QA sandbox alias on the Tester's laptop (SF AI Tester, exploratory runs)
  prod_alias: prod                  # the org the project names as production: AI never touches it
  api_version: "62.0"               # VERIFY current API version
# Branch -> GitHub Environment -> Apex test level (CIRCUIT-V4 section 3). Read by scripts/ci/env-for-branch.mjs in
# pr-checks.yml (base branch) and deploy.yml (pushed branch). First match wins; `*` does not match "/".
environments:
  - { branch: "sprint/*", environment: qa,         test_level: RunLocalTests }
  - { branch: dev,        environment: dev,        test_level: RunLocalTests }
  - { branch: sit,        environment: sit,        test_level: RunLocalTests }
  - { branch: uat,        environment: uat,        test_level: RunLocalTests }
  - { branch: main,       environment: production, test_level: RunLocalTests }
slack:
  workspace: acme
  channel: dev-review               # CodeRabbit's Slack agent and /review-room post PR reviews here
transcripts:
  sources: [paste, file, fireflies] # kept at the source or on the Architect's machine; never in git
