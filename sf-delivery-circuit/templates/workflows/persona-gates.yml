name: persona-gates
# G3/G4: only a `developers` member may add plan-approved, only a `testers` member may add testplan-approved.
#        Anyone else's label is removed. When both are present the Developer builds the story from their own
#        Claude session (the circuit no longer runs AI in CI).
# G5/G6/G7: a PR approval by a member of developers / testers / architects sets commit status
#        gate/developer / gate/tester / gate/architect on the approved commit. A new push needs new approvals.
# Team membership is read with the self-hosted runner's own `gh` sign-in (read:org); labels, comments and statuses
# are written with the job's GITHUB_TOKEN. No stored credentials. Fork PRs are skipped (and fail `guard`).
on:
  pull_request:
    types: [labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: persona-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label-gate:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.label.name == 'plan-approved' || github.event.label.name == 'testplan-approved')
    runs-on: [self-hosted, circuit]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false, sparse-checkout: scripts/ci }
      - name: Runner logins
        run: bash scripts/ci/runner-check.sh --gh --tools jq
      - name: Check who set the gate label
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.event.sender.login }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          ORG: ${{ github.repository_owner }}
        run: |
          R="$GITHUB_REPOSITORY"
          if [ "$LABEL" = plan-approved ]; then TEAM=developers; GATE=G3; else TEAM=testers; GATE=G4; fi
          if ! bash scripts/ci/team-member.sh "$TEAM" "$ACTOR"; then
            gh pr edit "$PR" --repo "$R" --remove-label "$LABEL"
            gh pr comment "$PR" --repo "$R" --body "Removed \`$LABEL\`: @$ACTOR is not in team \`$TEAM\`. Only $TEAM can set $GATE."
            exit 0
          fi
          eval "$(bash scripts/ci/resolve-story.sh --branch "$BRANCH")"
          if [ -z "${KEY:-}" ]; then echo "Not a story branch"; exit 0; fi
          if [ "$LABEL" = plan-approved ]; then MSG="Developer approved the plan"; else MSG="Tester approved the test plan"; fi
          bash scripts/ci/jira.sh comment "$KEY" "$MSG (@$ACTOR, PR #$PR)" || echo "::warning::Jira comment skipped (runner acli login?)"
          CURRENT=$(gh pr view "$PR" --repo "$R" --json labels --jq '[.labels[].name]')
          if jq -e 'index("plan-approved") and index("testplan-approved")' >/dev/null <<<"$CURRENT"; then
            gh pr edit "$PR" --repo "$R" --remove-label plan-review || true
            gh pr comment "$PR" --repo "$R" --body "G3 and G4 passed for $KEY. Developer: build the story from your own Claude session (Delivery Circuit extension), prove it with a check-only validate on DEV, then push."
          fi

  review-gate:
    if: >
      github.event_name == 'pull_request_review' && github.event.review.state == 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, circuit]
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false, sparse-checkout: scripts/ci }
      - name: Runner logins
        run: bash scripts/ci/runner-check.sh --gh
      - name: Set gate statuses for the reviewer's persona team
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.review.user.login }}
          SHA: ${{ github.event.review.commit_id }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ORG: ${{ github.repository_owner }}
        run: |
          [ "$SHA" = "$HEAD" ] || { echo "Approval is for an older commit; ignoring."; exit 0; }
          n=0
          for pair in developers:developer:G5 testers:tester:G6 architects:architect:G7; do
            TEAM=${pair%%:*}; rest=${pair#*:}; CTX=${rest%%:*}; GATE=${rest#*:}
            if bash scripts/ci/team-member.sh "$TEAM" "$ACTOR"; then
              gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f "context=gate/$CTX" \
                -f "description=$GATE approved by $ACTOR" >/dev/null
              echo "gate/$CTX set by $ACTOR"; n=$((n+1))
            fi
          done
          [ "$n" -le 1 ] || echo "::warning::$ACTOR is in more than one persona team; one approval satisfied $n gates. Keep persona teams disjoint."
