name: design-gate
# G1 + C5 for story PRs (replaces the v2 spec-gate). Required check. Runs on the self-hosted runner because it reads
# Jira with the runner's own Atlassian CLI login (acli jira auth login --web); no Jira token is stored anywhere.
#   G1  the story's epic carries an "Approved design version" set through the architects-only Jira transition, and
#       the epic is no longer in a design status (vars.DESIGN_PENDING_STATUSES, default "Backlog,Design Review").
#   C5  the story's "Approved design version" equals the epic's: otherwise
#       "Design changed since this story was planned: re-plan or re-approve".
# Non-story PRs (no feature/<KEY>-* branch) pass only when they change nothing under force-app/: code changes need a
# story, so a branch name cannot skip G1/C5. The gate scripts and jira-config come from the base commit, not the PR.
# Fork PRs are skipped here and fail `guard` in pr-checks, so they can never be merged.
# When the design is re-approved after this ran, re-run the check (the extension's "Re-run checks" or the Actions tab).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: design-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  design-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, circuit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5            # base commit: the PR cannot change the gate it is checked by
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .specify/extensions/jira
      - name: Story key
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          out=$(bash scripts/ci/resolve-story.sh --branch "$BRANCH") || exit 1
          eval "$out"
          if [ -n "${KEY:-}" ]; then echo "KEY=$KEY" >> "$GITHUB_ENV"; exit 0; fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') || { echo "::error::Could not list this PR's files"; exit 1; }
          if grep -q '^force-app/' <<<"$files"; then
            echo "::error::This PR changes force-app/ but its branch is not a story branch (feature/<KEY>-<slug>): code needs a story with an approved design (G1, C5)."
            exit 1
          fi
          echo "Not a story PR and no force-app changes: no design to check."
      - name: Runner logins
        if: env.KEY != ''
        run: bash scripts/ci/runner-check.sh --acli --tools node
      - name: G1 design approved and C5 design unchanged
        if: env.KEY != ''
        env:
          DESIGN_PENDING_STATUSES: ${{ vars.DESIGN_PENDING_STATUSES || 'Backlog,Design Review' }}
          JIRA_FIELD_APPROVED_DESIGN_VERSION: ${{ vars.JIRA_FIELD_APPROVED_DESIGN_VERSION }}
          JIRA_FIELD_DESIGN_PAGE: ${{ vars.JIRA_FIELD_DESIGN_PAGE }}
        run: node scripts/ci/design-gate.mjs --key "$KEY"
