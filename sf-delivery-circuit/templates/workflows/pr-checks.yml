name: pr-checks
# Delivery Circuit v4 (CIRCUIT-V4 section 4). GitHub-hosted runners only. No AI in CI.
#   resolve    base branch -> GitHub Environment + Apex test level (scripts/ci/env-for-branch.mjs, build.config.yml)
#   scan       REQUIRED check: Code Analyzer, LWC Jest, check-only deploy + Apex tests against the target sandbox,
#              logged in with that environment's SFDX_AUTH_URL (the only stored credential, never echoed).
#   coderabbit feature/* PRs only, after scan passed: comments "@coderabbitai review" once per head commit
#              (.coderabbit.yaml has auto_review disabled, so CodeRabbit reviews only green code).
# Fork PRs: `scan` gets no environment and fails in its first step, so it never reaches a secret and never merges.
# The environment map and env-for-branch.mjs are read from the BASE commit, so a PR cannot re-point its own target.
on:
  pull_request:
    branches: ["sprint/**", dev, sit, uat, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      test_level: ${{ steps.env.outputs.test_level }}
      same_repo: ${{ steps.repo.outputs.same_repo }}
    steps:
      - name: Same-repository PR?
        id: repo
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then echo "same_repo=true" >> "$GITHUB_OUTPUT"
          else echo "same_repo=false" >> "$GITHUB_OUTPUT"; echo "::warning::Fork PR from $HEAD_REPO: scan will fail without running."; fi
      - name: Environment map from the base commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci       # cone mode also brings root files such as build.config.yml
      - name: Resolve the target environment from the base branch
        id: env
        env:
          BASE_REF: ${{ github.base_ref }}
        # PRs into main validate against UAT (same code, already deployed there). Only deploy.yml uses `production`,
        # so a scan never waits for the production reviewers and production's branch policy stays main-only.
        run: |
          out=$(node scripts/ci/env-for-branch.mjs "$BASE_REF") || exit 1
          printf '%s\n' "$out" | sed 's/^environment=production$/environment=uat/' | tee -a "$GITHUB_OUTPUT"

  scan:
    needs: resolve
    # Runs even when resolve failed, so the required check reports failure instead of "skipped" (= success).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Environment (and its SFDX_AUTH_URL) only for same-repo PRs; '' means no environment. VERIFY that GitHub still
    # treats an empty environment name as "no environment".
    environment: ${{ needs.resolve.outputs.same_repo == 'true' && needs.resolve.outputs.environment || '' }}
    env:
      TARGET_ENV: ${{ needs.resolve.outputs.environment }}
      TEST_LEVEL: ${{ needs.resolve.outputs.test_level }}
    steps:
      - name: Same-repository PRs only
        env:
          SAME_REPO: ${{ needs.resolve.outputs.same_repo }}
          RESOLVED: ${{ needs.resolve.result }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$RESOLVED" != success ]; then
            echo "::error::Could not resolve the target environment for base branch $GITHUB_BASE_REF (see the resolve job)."; exit 1
          fi
          if [ "$SAME_REPO" != true ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::This PR comes from the fork $HEAD_REPO. The circuit checks only branches pushed to $GITHUB_REPOSITORY."; exit 1
          fi
          echo "Target environment: $TARGET_ENV (test level $TEST_LEVEL)"
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install @salesforce/plugin-code-analyzer
          sf --version
      - name: Code Analyzer (fails on severity 1-2)
        run: |
          if [ ! -d force-app ]; then echo "No force-app folder: nothing to analyse."; exit 0; fi
          # VERIFY flags against 'sf code-analyzer run --help' (Code Analyzer v5).
          sf code-analyzer run --workspace force-app --rule-selector Recommended --severity-threshold 2 \
            --output-file ca-results.html --output-file ca-results.json
      - name: LWC Jest
        run: |
          if [ ! -f package.json ]; then echo "No package.json: no LWC Jest."; exit 0; fi
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          if node -e 'process.exit(require("./package.json").scripts?.["test:unit"] ? 0 : 1)'; then npm run test:unit -- --ci --passWithNoTests
          elif [ -x node_modules/.bin/jest ]; then npx --no-install jest --ci --passWithNoTests
          else echo "Jest is not installed: skipped."; fi
      - name: Log in to the target sandbox
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::GitHub Environment '$TARGET_ENV' has no SFDX_AUTH_URL secret (circuit-bootstrap, environments step)."; exit 1
          fi
          # The URL goes over stdin from a shell builtin: never on a command line, never in the log.
          # VERIFY flag name with 'sf org login sfdx-url --help'.
          printf '%s' "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --alias circuit-target > /dev/null
          echo "Logged in to the $TARGET_ENV org."
      - name: Check-only deploy and Apex tests
        run: |
          if [ ! -d force-app ]; then echo "No force-app folder: nothing to validate."; exit 0; fi
          sf project deploy validate --source-dir force-app --target-org circuit-target --test-level "$TEST_LEVEL" --wait 120
      - name: Log out
        if: always()
        run: sf org logout --target-org circuit-target --no-prompt > /dev/null 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4              # VERIFY current major
        with:
          name: code-analyzer-results
          path: |
            ca-results.html
            ca-results.json
          if-no-files-found: ignore

  coderabbit:
    needs: scan
    if: >
      startsWith(github.head_ref, 'feature/') && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Ask CodeRabbit to review this commit (once per head SHA)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MARKER="<!-- circuit:coderabbit-review:$SHA -->"
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[].body' | grep -qF "$MARKER"; then
            echo "Review already requested for $SHA."; exit 0
          fi
          # VERIFY on the first PR that CodeRabbit acts on a command posted by github-actions[bot].
          printf '@coderabbitai review\n\n%s\n' "$MARKER" > "$RUNNER_TEMP/coderabbit.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/coderabbit.md"
