name: spec-gate
# G1 enforcement for spec PRs: no OPEN clarifications, plan.md Architect Sign-Off ticked, and the commit that
# ticked it authored by a member of `architects`. Stories need Story 00; designed tests must be well-formed.
# Always runs (required check); passes when the PR touches no spec folder.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Check changed spec folders
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          ORG: ${{ github.repository_owner }}
        run: |
          DIRS=$(git diff --name-only "$BASE...HEAD" -- .specify/specs | grep -oE '^\.specify/specs/[0-9]{3}-[^/]+' | sort -u || true)
          [ -n "$DIRS" ] || { echo "No spec changes."; exit 0; }
          fail=0
          for d in $DIRS; do
            echo "== $d"
            [ -f "$d/spec.md" ] || { echo "FAIL missing spec.md"; fail=1; continue; }
            OPEN=$(grep -rlE '\bOPEN\b' "$d"/*clarif* 2>/dev/null || true)
            if [ -n "$OPEN" ]; then echo "FAIL open clarification items in: $OPEN"; fail=1; fi
            if [ -f "$d/plan.md" ]; then
              if grep -qiE '\[x\][[:space:]]*APPROVED' "$d/plan.md"; then
                SHA=$(git log -G '\[[xX]\][[:space:]]*APPROVED' --format=%H -1 -- "$d/plan.md")
                WHO=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.author.login // empty' 2>/dev/null || true)
                STATE=$([ -n "$WHO" ] && gh api "orgs/$ORG/teams/architects/memberships/$WHO" --jq .state 2>/dev/null || echo none)
                if [ "$STATE" = active ]; then echo "ok   G1 sign-off by $WHO ($SHA)"
                else echo "FAIL G1 sign-off commit $SHA is not by an architects member (author: ${WHO:-unknown GitHub user})"; fail=1; fi
              else
                echo "FAIL plan.md Architect Sign-Off is not ticked (G1)"; fail=1
              fi
            fi
            if ls "$d"/task_story_*.md >/dev/null 2>&1; then
              [ -f "$d/task_story_00.md" ] || { echo "FAIL stories exist but task_story_00.md (Story 00) is missing"; fail=1; }
              [ -f "$d/plan.md" ] || { echo "FAIL stories exist without plan.md"; fail=1; }
            fi
            if [ -d "$d/tests" ]; then node scripts/ci/check-tc-coverage.mjs --design-only "$d" || fail=1; fi
          done
          exit $fail
